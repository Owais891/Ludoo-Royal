name: ludo_royale
description: Ludo Royale - Professional multiplayer Ludo game for Android, iOS and Web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  go_router: ^12.0.0
  cupertino_icons: ^1.0.6
  confetti: ^0.7.0
  vibration: ^1.8.4
  audioplayers: ^5.2.0
  cached_network_image: ^3.3.0
  uuid: ^4.2.0
  intl: ^0.18.1
  json_annotation: ^4.8.1
  collection: ^1.17.0
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  sqflite_common_ffi_web: ^0.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/animations/
    - assets/avatars/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
